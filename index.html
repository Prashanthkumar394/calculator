<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator (Add & Subtract)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <h2>Basic Calculator</h2>
    
    <div class="input-group">
      <label for="num1">First Number:</label>
      <input type="number" id="num1" min="0" placeholder="Enter positive number">
    </div>

    <div class="input-group">
      <label for="num2">Second Number:</label>
      <input type="number" id="num2" min="0" placeholder="Enter positive number">
    </div>

    <div class="button-group">
      <button id="addBtn">Add (+)</button>
      <button id="subBtn" class="sub-btn">Subtract (-)</button>
    </div>

    <div class="result-box">
      <span>Result:</span>
      <strong id="resultDisplay">0</strong>
    </div>

    <p id="errorMessage" class="error-msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
